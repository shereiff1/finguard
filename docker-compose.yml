version: '3.8'

services:
    kafka:
        image: confluentinc/cp-kafka:7.5.0
        container_name: finguard-kafka
        ports:
            - '9092:9092'
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
            KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
            KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
            KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
            CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
            KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
            KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
            KAFKA_PROCESS_ROLES: 'broker,controller'
            KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
        healthcheck:
            test: ['CMD', 'kafka-topics', '--bootstrap-server', 'localhost:9092', '--list']
            interval: 10s
            timeout: 10s
            retries: 10
            start_period: 30s

    postgres:
        image: postgres:16-alpine
        container_name: finguard-postgres
        ports:
            - '5432:5432'
        environment:
            POSTGRES_DB: finguard
            POSTGRES_USER: finguard
            POSTGRES_PASSWORD: finguard
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./init.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U finguard']
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        container_name: finguard-redis
        ports:
            - '6379:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5

    go-server:
        build:
            context: ./finguard-ingestion
            dockerfile: Dockerfile
        container_name: finguard-go-server
        ports:
            - '8080:8080'
        environment:
            KAFKA_BROKER: 'kafka:29092'
            KAFKA_TOPIC: 'transactions.raw'
            WS_PORT: '8080'
        depends_on:
            kafka:
                condition: service_healthy
        restart: on-failure

    ml:
        build:
            context: ./finguard-ml
            dockerfile: Dockerfile
        container_name: finguard-ml
        ports:
            - '8000:8000'
        environment:
            KAFKA_BOOTSTRAP_SERVERS: 'kafka:29092'
            REDIS_URL: 'redis://redis:6379'
            MODEL_PATH: 'app/models/fraud_model.onnx'
            APP_ENV: 'production'
        depends_on:
            redis:
                condition: service_healthy
        restart: on-failure

    ledger:
        build:
            context: ./finguard-ledger
            dockerfile: Dockerfile
        container_name: finguard-ledger
        ports:
            - '8081:8080'
        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finguard
            SPRING_DATASOURCE_USERNAME: finguard
            SPRING_DATASOURCE_PASSWORD: finguard
            SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
            SPRING_JPA_HIBERNATE_DDL_AUTO: update
            SPRING_FLYWAY_BASELINE_ON_MIGRATE: true
            SPRING_FLYWAY_BASELINE_VERSION: 0
        depends_on:
            kafka:
                condition: service_healthy
            postgres:
                condition: service_healthy
        restart: on-failure

volumes:
    postgres_data:
